name: Uptime check

# Cheap, no-account-needed stand-in for a dedicated uptime monitor (UptimeRobot etc.): pings the
# live backend health endpoint and the live frontend on a schedule, and fails loudly (GitHub emails
# workflow-failure notifications by default) if either is down. Doesn't replace a real monitor with
# push/SMS alerting -- it's the first, free rung of "notice when it's down" rather than "find out
# from a user."
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Backend health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api-kiraplus.aliffaizuddin.uk/health)
          echo "api-kiraplus.aliffaizuddin.uk/health -> $code"
          test "$code" = "200"

      - name: Frontend
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://kiraplus.aliffaizuddin.uk/)
          echo "kiraplus.aliffaizuddin.uk -> $code"
          test "$code" = "200"
