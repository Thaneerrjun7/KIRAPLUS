name: Deploy frontend

# Builds frontend/ as a static export and deploys it to Cloudflare Pages via
# Direct Upload (wrangler), not Cloudflare's Git integration -- linking a repo
# through Cloudflare's GitHub App requires admin/owner permission on the repo,
# which a contributor doesn't have here. Direct Upload only needs a Cloudflare
# API token, entirely independent of who owns this GitHub repo. See
# DEPLOYMENT-CHECKLIST.md (untracked, local) for the one-time Cloudflare Pages
# project creation and secrets this assumes: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths: ["frontend/**"]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* vars are inlined into the static export at build
          # time -- there's no server at runtime to read them from later.
          NEXT_PUBLIC_API_URL: https://api-kiraplus.aliffaizuddin.uk
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_LANGUAGE: en

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/out --project-name=kiraplus-frontend --branch=main
