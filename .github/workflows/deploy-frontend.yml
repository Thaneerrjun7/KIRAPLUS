name: Deploy frontend

# Builds frontend/ as a static export and deploys it as a Cloudflare Workers
# Static Assets site (frontend/wrangler.jsonc), not Cloudflare Pages' Git
# integration -- linking a repo through Cloudflare's GitHub App requires
# admin/owner permission on the repo, which a contributor doesn't have here.
# `wrangler deploy` only needs a Cloudflare API token, entirely independent of
# who owns this GitHub repo. See DEPLOYMENT-CHECKLIST.md (untracked, local) for
# the secrets this assumes: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    # This workflow file itself is included so a CI-only fix here can
    # actually trigger a run -- a push touching only .github/workflows/**
    # doesn't match a paths filter of just "frontend/**" (learned this the
    # hard way: #20 fixed a Wrangler version pin but never ran on merge).
    paths: ["frontend/**", ".github/workflows/deploy-frontend.yml"]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Wrangler 4.x requires Node >=22 -- this sets the Node version for
          # every step in the job, including the wrangler-action step below,
          # not just the build step. 20 failed CI with "Wrangler requires at
          # least Node.js v22.0.0" even though the build itself doesn't need
          # more than 20.
          node-version: 22

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* vars are inlined into the static export at build
          # time -- there's no server at runtime to read them from later.
          NEXT_PUBLIC_API_URL: https://api-kiraplus.aliffaizuddin.uk
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_LANGUAGE: en

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
          # cloudflare/wrangler-action's own default Wrangler version predates
          # assets-only deploys (no `main` script) -- without this pin it
          # fails with "Missing entry-point", even though the exact same
          # wrangler.jsonc deploys fine locally with a current Wrangler.
          # Pinned to the version verified locally (see DEPLOYMENT-CHECKLIST.md).
          wranglerVersion: "4.127.0"
