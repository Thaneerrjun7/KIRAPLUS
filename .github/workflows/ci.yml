name: CI

# Runs on every PR and every push to main -- unlike deploy-backend.yml/deploy-frontend.yml (which
# only build+ship), this is the actual test gate: nothing here deploys anything, it just proves the
# two layers still pass their own test suites. Doesn't require path filters the way the deploy
# workflows do, since a broken test in either layer is worth knowing about regardless of which
# layer's files changed.
on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Same build-time values deploy-frontend.yml uses -- irrelevant to whether the build
          # itself succeeds, but keeps this job representative of the real deploy build.
          NEXT_PUBLIC_API_URL: https://api-kiraplus.aliffaizuddin.uk
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_LANGUAGE: en
