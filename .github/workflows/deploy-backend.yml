name: Deploy backend

# Builds backend/Dockerfile, pushes to Docker Hub, then tells the deploy target to
# pull and run it -- the target never clones this repo. Docker Hub (not GHCR) on
# purpose: the image lives under the pusher's own Docker Hub account, independent
# of who owns this GitHub repo -- no package-visibility/ownership setup needed on
# the repo owner's side at all. See DEPLOYMENT-CHECKLIST.md (untracked, local) for
# the full setup this assumes: DOCKERHUB_USERNAME/DOCKERHUB_TOKEN and
# DROPLET_HOST/DROPLET_USER/DROPLET_SSH_KEY secrets, and /opt/kiraplus/deploy.sh
# already present on the target.

on:
  push:
    branches: [main]
    # data/** is included because it's baked into the image too -- see
    # backend/Dockerfile's comment on why (profile_service.py's fixture path).
    paths: ["backend/**", "data/**"]

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/kiraplus-backend"
          docker build \
            -f backend/Dockerfile \
            -t "${IMAGE}:${{ github.sha }}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: /opt/kiraplus/deploy.sh ${{ github.sha }}
